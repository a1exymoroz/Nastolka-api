spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?sslmode=require
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon closes idle connections from its side well before Hikari's 30-minute
# default maxLifetime, so Hikari would try to reuse connections Neon already
# killed. Retire connections proactively instead.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.idle-timeout=150000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.google.client-id=${GOOGLE_CLIENT_ID}

server.port=${PORT:8080}

app.bgg.token=${BGG_TOKEN:}
app.bgg.base-url=${BGG_API_BASE_URL:https://boardgamegeek.com/xmlapi2}

app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-secret=${TELEGRAM_BOT_SECRET:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@nastolka.local}
app.admin.password=${ADMIN_PASSWORD:}
