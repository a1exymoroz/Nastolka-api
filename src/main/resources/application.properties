spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.cache.bgg-search.ttl-minutes=${BGG_SEARCH_CACHE_TTL_MINUTES:20}
app.cache.bgg-game-details.ttl-minutes=${BGG_GAME_DETAILS_CACHE_TTL_MINUTES:30}
app.cache.games-list.ttl-minutes=${GAMES_LIST_CACHE_TTL_MINUTES:60}

app.rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:10}
app.rate-limit.auth.refill-tokens=${RATE_LIMIT_AUTH_REFILL_TOKENS:10}
app.rate-limit.auth.refill-period-seconds=${RATE_LIMIT_AUTH_REFILL_SECONDS:60}

app.rate-limit.bgg.capacity=${RATE_LIMIT_BGG_CAPACITY:5}
app.rate-limit.bgg.refill-tokens=${RATE_LIMIT_BGG_REFILL_TOKENS:5}
app.rate-limit.bgg.refill-period-seconds=${RATE_LIMIT_BGG_REFILL_SECONDS:60}
