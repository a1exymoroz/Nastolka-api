spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT}/${POSTGRES_DB:nastolka}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.google.client-id=${GOOGLE_CLIENT_ID}

server.port=${SERVER_PORT}

app.bgg.token=${BGG_TOKEN:}
app.bgg.base-url=${BGG_API_BASE_URL:https://boardgamegeek.com/xmlapi2}

app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@nastolka.local}
app.admin.password=${ADMIN_PASSWORD:}
